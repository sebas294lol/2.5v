name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip -o TrayectoriaTiros-2.5.zip -d proyecto

      - name: Buscar proyecto Android
        run: |
          echo "Buscando settings.gradle..."
          find proyecto -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \)

      - name: Compilar APK
        run: |
          PROJECT_DIR=$(dirname "$(find proyecto -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -1)")
          echo "Proyecto encontrado en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Trayectoria-de-Tiros-2.5
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
